name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  agent-core:
    name: agent-core + desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # No Ollama on the runner, so the live-model integration tests skip
      # themselves (modelIsReady() at the top of agents.integration.test.ts).
      # Everything else is real.
      - run: npm --prefix agent-core run build
      - run: npx --prefix agent-core tsc -p agent-core/tsconfig.json --noEmit
      - run: npm --prefix agent-core test
      - run: npm --prefix desktop run typecheck
      - run: npm --prefix desktop test

  ios:
    name: iOS build
    # Needs Xcode 26. DesignSystem/Glass.swift calls glassEffect,
    # buttonStyle(.glass) and GlassEffectContainer — `#available(iOS 26, *)`
    # gates them at runtime, but the symbols still have to exist at compile
    # time, so an older SDK fails with a wall of "cannot find in scope".
    # macos-15 ships Xcode 16 / the iOS 18 SDK and cannot build this.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check the toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphonesimulator || true
          # Fail loudly and specifically if the image ever moves off Xcode 26.
          if ! xcodebuild -showsdks | grep -qE 'iphonesimulator(2[6-9]|[3-9][0-9])'; then
            echo "::error::need the iOS 26 SDK or newer for the Liquid Glass APIs in Glass.swift"
            exit 1
          fi

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project ios/FamilyAgent.xcodeproj -scheme FamilyAgent
          # The pipe is only to keep the log readable. xcodebuild's own exit
          # status does not survive a pipe without pipefail, and `|| true` would
          # swallow it even then — so the explicit grep below is what decides
          # whether this job passes. Without it the job is green no matter what,
          # which is worse than having no iOS check at all.
          xcodebuild -project ios/FamilyAgent.xcodeproj -scheme FamilyAgent \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/dd build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild.log \
            | grep -E 'error:|warning:|BUILD (FAILED|SUCCEEDED)' || true
          grep -q 'BUILD SUCCEEDED' /tmp/xcodebuild.log

      - name: Fail on any warning
        run: |
          if grep -E ' warning: ' /tmp/xcodebuild.log | grep -v 'AppIntents.framework'; then
            echo "::error::the iOS build produced warnings"
            exit 1
          fi
          echo "no warnings"

name: Release (macOS)

# scripts/cut-release.sh publishes an empty release for the version in
# tauri.conf.json; this reacts to that same `release: published` event —
# same shape as release-linux.yml / release-windows.yml — by building,
# signing, notarizing and attaching the .dmg + updater artifact.
# `workflow_dispatch` re-runs it against any existing tag, or (with
# `no_upload`) just builds+signs+notarizes to validate the pipeline without
# touching a real release.
#
# Needs these repo secrets (see scripts/sign-desktop.sh's header for what
# each credential means):
#   MACOS_CERTIFICATE          base64 of a .p12 (Developer ID Application
#                               cert + private key)
#   MACOS_CERTIFICATE_PASSWORD the password that .p12 was exported with
#   APPLE_API_KEY               base64 of the App Store Connect API key .p8
#   APPLE_API_KEY_ID             its key id
#   APPLE_API_ISSUER             the issuer id
#   TAURI_SIGNING_PRIVATE_KEY            the updater minisign private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password (blank if none)
# Unlike Linux/Windows there is no unsigned fallback: any of these missing
# fails the build rather than shipping an unsigned/un-notarized .app, which
# Gatekeeper would refuse on anyone else's Mac anyway.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the macOS build to (blank = latest)"
        required: false
      no_upload:
        description: "Build, sign and notarize only — don't attach to a release (pipeline validation)"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with release-linux.yml / release-windows.yml — see the comment
# there on why this has to be one lock across all three, not one per platform.
concurrency:
  group: ${{ inputs.no_upload == true && format('release-mac-validate-{0}', github.run_id) || format('release-assets-{0}', github.event.release.tag_name || inputs.tag || 'latest') }}
  cancel-in-progress: false

jobs:
  mac:
    # Apple Silicon, matching the arm64-only local release today (see
    # release-mac.sh's DMG_NAME / darwin-aarch64 in latest.json).
    runs-on: macos-14
    steps:
      - name: Resolve the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ inputs.no_upload }}" != "true" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Attaching macOS bundle to ${TAG:-<none, --no-upload>}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # A fresh, temporary keychain rather than the runner's default login
      # keychain: it's created empty, holds only this one certificate, and is
      # deleted in the cleanup step below regardless of how the job ends —
      # nothing about it persists past this job on GitHub's ephemeral runner.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, `codesign` prompts for keychain access interactively
          # the first time it touches the imported key — fine on a Mac in
          # front of you, fatal in a non-interactive CI job.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Prepend so `security find-identity` (what sign-desktop.sh /
          # release-mac-ci.sh use to pick the identity) sees it; keep the
          # existing list rather than replacing it.
          # Not `mapfile` — macOS's system /bin/bash is stuck at 3.2, which
          # doesn't have it.
          EXISTING=()
          while IFS= read -r line; do EXISTING+=("$line"); done \
            < <(security list-keychains -d user | sed 's/^ *"//;s/" *$//')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          rm -f "$CERT_PATH"

      - name: Import the App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$APPLE_API_KEY" | base64 --decode \
            -o "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - run: npm ci

      - name: Build, sign, notarize and publish the macOS bundle
        env:
          GH_TOKEN: ${{ github.token }}
          FA_ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          FA_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          FA_KEY_LOCATION: ${{ format('~/.appstoreconnect/private_keys/AuthKey_{0}.p8', secrets.APPLE_API_KEY_ID) }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS=()
          [ -n "${{ steps.tag.outputs.tag }}" ] && ARGS+=(--tag "${{ steps.tag.outputs.tag }}")
          [ "${{ inputs.no_upload }}" = "true" ] && ARGS+=(--no-upload)
          ./scripts/release-mac-ci.sh "${ARGS[@]}"

      - name: Upload the DMG as a workflow artifact
        if: ${{ inputs.no_upload == true }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Clean up the temporary keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect"

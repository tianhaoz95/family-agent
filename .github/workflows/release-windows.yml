name: Release (Windows)

# The macOS release is a local, notarized build (scripts/release-mac.sh).
# Windows has no notarization step either, so it runs here, same pattern as
# release-linux.yml: when a release is published, build the NSIS installer on
# a clean Windows runner (x64 and arm64, natively — see the matrix below) and
# attach it to that same release. `workflow_dispatch` re-runs it against any
# existing tag, or (with `no_upload`) just builds to validate the pipeline
# without touching a real release.
#
# Auto-updates for Windows need the same Tauri updater signing key as the
# Linux release, already set (or not) as a repo secret:
#   gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/family-agent-updater.key
#   gh secret set TAURI_SIGNING_PRIVATE_KEY_PASSWORD        # if the key has one
# Without it the job still ships an installable .exe — just no updater entry.
#
# No OS-level code signing here — an unsigned .exe shows a SmartScreen
# "unknown publisher" prompt on first run. That's a separate, bigger decision
# (a code-signing cert) independent of the updater working at all.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the Windows build to (blank = latest)"
        required: false
      no_upload:
        description: "Build only — don't attach to a release (pipeline validation)"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    # Keep this workflow's shell the same as release-linux.yml's (and every
    # other release script) rather than forking into PowerShell/cmd for one
    # platform. GitHub's windows runners ship Git for Windows, which puts
    # bash.exe on PATH — same as any dev box with Git installed.
    shell: bash

jobs:
  windows:
    strategy:
      # One arch failing (most likely arm64 — the newer, less-trodden path)
      # shouldn't cancel the other; each attaches its own independent asset.
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Job-level (not workflow-level) so each matrix arch gets its own
    # independent group — x64 and arm64 attach different assets and should
    # run in parallel, not serialize against each other. Not shared with
    # release-{linux,mac}.yml either — see the comment in release-linux.yml
    # on why a group shared across all release workflows was reverted.
    # A `no_upload` validation run never touches a real release's
    # latest.json, so give it its own lane instead of queuing behind (or
    # blocking) a real release.
    concurrency:
      group: ${{ inputs.no_upload == true && format('release-windows-{0}-validate-{1}', matrix.arch, github.run_id) || format('release-windows-{0}-{1}', matrix.arch, github.event.release.tag_name || inputs.tag || 'latest') }}
      cancel-in-progress: false
    steps:
      - name: Resolve the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ inputs.no_upload }}" != "true" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Attaching Windows ${{ matrix.arch }} bundle to ${TAG:-<none, --no-upload>}"

      # Leading hypothesis for a build failure seen here: prepare-sidecar.sh's
      # own `[ -f ]` check confirms sidecar/node exists right after it's
      # copied (a plain node.exe renamed with no extension), yet Tauri's
      # build script reports it missing several minutes later, after nothing
      # else in the build touches that path. That gap-then-vanish pattern is
      # the signature of Windows Defender's real-time scan quarantining a
      # freshly-written binary mid-build — a known flake on GitHub-hosted
      # Windows runners; excluding the workspace is the standard fix. If the
      # file still goes missing with this in place, look elsewhere.
      - name: Exclude the workspace from Windows Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      # Check out the commit this workflow runs against, NOT the release tag —
      # see the identical note in release-linux.yml. Same reasoning here.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          # Separate cache per arch — an x64 target/ directory is useless
          # (and would just be evicted) on an arm64 runner and vice versa.
          key: ${{ matrix.arch }}

      - run: npm ci

      - name: Build and publish the Windows bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS=()
          [ -n "${{ steps.tag.outputs.tag }}" ] && ARGS+=(--tag "${{ steps.tag.outputs.tag }}")
          [ "${{ inputs.no_upload }}" = "true" ] && ARGS+=(--no-upload)
          ./scripts/release-windows.sh "${ARGS[@]}"

      - name: Upload the installer as a workflow artifact
        if: ${{ inputs.no_upload == true }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

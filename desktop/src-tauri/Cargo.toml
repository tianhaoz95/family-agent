[package]
name = "family-agent-desktop"
version = "0.1.0"
description = "Local-first family document, schedule, and task assistant."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# Updater + the restart it needs. Desktop only — see main.rs.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux only: reach the underlying WebKitGTK webview to grant getUserMedia
# (the mic, for Chat voice input). Pinned to the exact version wry already
# pulls in so it resolves to the same compiled crate — no new download.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[[bin]]
name = "family-agent-desktop"
path = "src/main.rs"
